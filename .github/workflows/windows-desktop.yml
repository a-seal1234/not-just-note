name: Windows desktop package

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # Provision the runner with Clang 21 in GNU target mode and the LLVM-MinGW
    # sysroot, CMake 3.31, Ninja, Python 3.13, ccache, Git, and ample disk space.
    # KDE's Windows dependency set and full build will not fit a standard runner.
    runs-on: [self-hosted, Windows, X64, njn-krita-build]
    timeout-minutes: 360
    env:
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-windows
      KDECI_REPO_METADATA_PATH: ${{ github.workspace }}\krita-deps-management\repo-metadata
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: 'False'
      KDECI_BUILD_TYPE: Release
      KDECI_EXTRA_CMAKE_ARGS: '-DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=OFF -DBRANDING=NotJustNote -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DTIFF_CAN_WRITE_PSD_TAGS_EXITCODE=0'
      KRITACI_SKIP_DEBUG_PACKAGE: 'True'
      KRITACI_BUILD_INSTALLERS: 'False'
      KRITACI_RELEASE_PACKAGE_NAMING: 'True'
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: 'True'
      PYTHONUTF8: '1'
      CI_PROJECT_NAME: krita
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHORT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Windows compiler and build tools
        shell: pwsh
        run: |
          foreach ($tool in @('clang', 'clang++', 'cmake', 'ninja', 'ccache', 'git', 'python')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "The self-hosted runner is missing required tool: $tool"
            }
          }
          $pythonVersion = python --version
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -notmatch '^Python 3\.13\.') {
            throw "The self-hosted runner requires Python 3.13; found: $pythonVersion"
          }
          $llvmRoot = Join-Path $env:LOCALAPPDATA 'Programs\llvm-mingw-20251118-ucrt-x86_64\llvm-mingw-20251118-ucrt-x86_64'
          $resourceDir = Join-Path $llvmRoot 'lib\clang\21'
          $target = clang --target=x86_64-w64-windows-gnu -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -ne 'x86_64-w64-windows-gnu') {
            throw "The Windows compiler must target GNU ABI; found: $target"
          }
          $cxxTarget = clang++ --target=x86_64-w64-windows-gnu -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $cxxTarget -ne 'x86_64-w64-windows-gnu') {
            throw "The Windows C++ compiler must target GNU ABI; found: $cxxTarget"
          }
          $sysrootArg = $llvmRoot.Replace('\', '/')
          $resourceArg = $resourceDir.Replace('\', '/')
          $clangPath = (Get-Command clang.exe).Source.Replace('\', '/')
          $clangxxPath = (Get-Command clang++.exe).Source.Replace('\', '/')
          $common = "--target=x86_64-w64-windows-gnu --sysroot=$sysrootArg -resource-dir=$resourceArg -fuse-ld=lld -rtlib=compiler-rt -unwindlib=libunwind"
          $clangCmd = Join-Path $llvmRoot 'bin\clang.cmd'
          $clangxxCmd = Join-Path $llvmRoot 'bin\clang++.cmd'
          Set-Content -LiteralPath $clangCmd -Value "@echo off`r`n`"$clangPath`" $common %*`r`nexit /b %errorlevel%`r`n" -Encoding Ascii
          Set-Content -LiteralPath $clangxxCmd -Value "@echo off`r`n`"$clangxxPath`" $common -stdlib=libc++ %*`r`nexit /b %errorlevel%`r`n" -Encoding Ascii
          $cc = $clangCmd.Replace('\', '/')
          $cxx = $clangxxCmd.Replace('\', '/')
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CC=$cc`nCXX=$cxx`n", [System.Text.UTF8Encoding]::new($false))
          $cmakeVersion = cmake --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or $cmakeVersion -notmatch '^cmake version 3\.31\.') {
            throw "The self-hosted runner requires CMake 3.31; found: $cmakeVersion"
          }
          python -m pip --version
          ccache --version
          clang --version
          clang++ --version
          cmake --version

      - name: Fetch public KDE build helpers
        shell: pwsh
        run: |
          git clone --depth 1 --branch master https://invent.kde.org/packaging/krita-deps-management.git
          git clone --depth 1 https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities
          python -m pip install --upgrade pip
          python -m pip install -r krita-deps-management/requirements.txt
          python -m pip install -r krita-deps-management/ci-utilities/requirements-windows.txt

      - name: Prepare KDE dependency manifest
        shell: pwsh
        run: |
          python krita-deps-management/tools/replace-branch-in-seed-file.py `
            krita-deps-management/latest/krita-deps.yml -p `
            -o branch-corrected-deps.yml -d master
          python krita-deps-management/tools/generate-deps-file.py `
            -s branch-corrected-deps.yml -o .kde-ci.yml

      - name: Build Not Just Note with KDE's public Windows dependencies
        env:
          KDECI_CACHE_PATH: ${{ runner.temp }}\krita-deps-cache
          KDECI_CC_CACHE: ${{ runner.temp }}\krita-ccache
        shell: pwsh
        run: |
          python -u krita-deps-management/ci-utilities/run-ci-build.py `
            --project krita --branch $env:GITHUB_REF_NAME `
            --platform Windows/Qt5/Shared --skip-publishing

      - name: Package Windows build
        shell: pwsh
        run: |
          python -u build-tools/ci-scripts/build-windows-package.py `
            --skip-debug-package --release-package-naming
          $package = Get-ChildItem -File 'krita-x64-*.zip' | Select-Object -First 1
          if (-not $package) { throw 'The Windows packaging step did not produce a ZIP.' }
          Move-Item $package.FullName 'not-just-note-windows-x64-0.1.7-rc1.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: not-just-note-windows-0.1.7-rc1
          path: not-just-note-windows-x64-0.1.7-rc1.zip
          if-no-files-found: error
          retention-days: 30
